const empty = (title,description,action='search',text='选择股票') => `<div class="empty"><div class="empty-symbol">${icon('search')}</div><h2>${title}</h2><p>${description}</p>${btn(text,action,'','primary')}</div>`;
function stockTable(items,{watch=false,screen=false,preview=false,activeId=state.selected}={}) {

function marketStrip() {

 `${risk?`<div class="attention-band">${icon('warn')}<p><strong>先检查 ${risk.name}</strong><span>${risk.reason}，${risk.risk}。</span></p>${btn('查看风险预案','stock',`data-id="${risk.id}"`,'quiet')}</div>`:''}<div class="grid-main dashboard-grid"><div class="stack"><section class="panel flush home-watch"><div class="panel-head"><div><h2>自选里的下一步</h2><p>点击股票看摘要，确认条件后再行动</p></div><a class="text-button" href="#watchlist">管理自选</a></div><div class="home-filter">${tabs([['all',`全部 ${watched.length}`],['risk',`风险关注 ${watched.filter(stock=>stock.kind==='risk').length}`]],state.homeFilter,'home-filter')}</div>${items.length?stockTable(items,{preview:true,activeId:current.id}):empty(state.homeFilter==='risk'?'没有标记为风险关注的样例':'还没有自选股票',state.homeFilter==='risk'?'这不代表没有风险，可回到全部列表继续核验。':'先选择一只股票，查看策略后再加入关注。',state.homeFilter==='risk'?'home-filter-all':'search',state.homeFilter==='risk'?'查看全部':'添加股票')}<div class="table-footer"><span>合成行情截至 15:00</span><span>已收盘 · 不自动刷新</span></div></section><section class="daily-context"><div class="panel-head"><h2>今天的信息背景</h2><a class="text-button" href="#market">市场概览</a></div><div class="context-row"><time>14:20</time><div><strong>制造主题受到关注，订单证据仍待核验</strong><p>行业热度只说明值得看，不直接上调公司的盈利判断。</p></div>${badge('行业样例')}</div><div class="context-row"><time>昨 18:30</time><div><strong>回款约束没有因股价上涨而消失</strong><p>先核验反证，再决定是否调整原有计划。</p></div>${badge('公告样例')}</div></section><div class="recent-inline">${icon('history')}<span>最近分析：澄川智造 · 今日 15:10</span><a class="text-button" href="#history">查看记录</a></div></div><aside class="dashboard-brief"><section class="panel brief-panel" id="home-stock-brief" aria-label="当前股票策略摘要">${current?strategyBrief(current):'<h2>从一只股票开始</h2><p class="field-hint">选择或添加股票后，这里会展示它的当前判断、关键位置与风险。</p>'}</section><p class="brief-footnote">模拟数据与操作，仅用于体验界面。<br>不代表实时行情或投资建议。</p></aside></div>`;
}

}

   <details class="scenario-disclosure" name="trade-scenario" data-scenario="pressure" ${state.planScenario==='pressure'?'open':''}><summary><span><strong>放量越过压力</strong><small>${ranges(stock.pressure)} 元</small></span>${icon('chevron')}</summary><div class="scenario-body"><p><strong>看什么：</strong>收盘超过 ${money(stock.pressure[1])} 元，成交量至少为此前 20 日均量的 1.20 倍（演示门槛）。盘中冲高不算确认。</p><p><strong>应对：</strong>${long?'不能用突破替代盈利与估值验证，不给长期目标价。':held?'压力区转弱时评估减仓；有效突破则重评持有。':'确认后等待回测，不追开盘跳空。'}</p><button class="text-button" data-action="scenario-chart" data-value="pressure">在图上看压力区</button></div></details>
   <details class="scenario-disclosure risk-scenario" name="trade-scenario" data-scenario="stop" ${state.planScenario==='stop'?'open':''}><summary><span><strong>破位或出现新风险</strong><small>风险参考线 ${money(stock.stop)} 元</small></span>${icon('chevron')}</summary><div class="scenario-body"><p><strong>看什么：</strong>跌破参考线，或新的信息否定经营假设，任一发生就重评。</p><p><strong>应对：</strong>${held?'优先评估减仓或退出，不机械等待收盘。':'取消介入计划，不因下跌便宜就抄底。'}止损不保证按计划价格成交。</p><button class="text-button" data-action="scenario-chart" data-value="stop">在图上看风险线</button></div></details>
   <div class="plan-actions">${btn('设置关键价位提醒','alert-new',`data-id="${stock.id}"`,'primary')}${btn('带着策略追问 '+icon('arrow'),'ask',`data-id="${stock.id}"`,'quiet')}</div>

 </section>`;
 const price=`<section class="panel" id="strategy-price" tabindex="-1" aria-labelledby="price-heading"><div class="panel-head"><h2 id="price-heading">量价与关键位置</h2>${tabs([['daily','日 K'],['weekly','周 K'],['monthly','月 K']],state.period,'period')}</div><div class="quote-row"><span class="price">${money(stock.price)}</span><span class="${stock.change>=0?'positive':'negative'}">${stock.change>=0?'+':''}${stock.change}%</span><span class="context">昨收 ${money(stock.previous)} 元<br>技术位置不是估值目标</span></div><div data-chart="stock"></div><div class="row chart-filters" role="group" aria-label="图表参考位置">${[['support','回踩区'],['pressure','压力区'],['stop','风险线']].map(([key,name])=>`<button class="btn" data-action="chart-overlay" data-value="${key}" aria-pressed="${state.overlay===key}">${name}</button>`).join('')}</div><p class="field-hint" id="chart-context">${state.overlay==='support'?'回踩观察：'+ranges(stock.range):state.overlay==='pressure'?'突破 / 止盈观察：'+ranges(stock.pressure):'风险参考：'+money(stock.stop)} 元。${state.period==='monthly'?'10 月月线尚未收盘。':'盘中触价不等于收盘确认。'}</p></section>`;

 `<section class="panel focus-panel decision-summary"><div class="row between"><span class="mini-label">收盘后的条件预案</span>${tabs([['flat','未持仓'],['held','已持仓']],state.position,'position')}</div><h2 class="decision-title">${long?'长期证据不足，先核验持有逻辑':held?'持仓观察，先明确防守条件':'等待确认，暂不追入'}</h2><p>${esc(stock.reason)}。${long?'价格变化不能替代盈利、现金流与估值验证。':'先核验条件，不因一根阳线改变计划。'}</p><details class="decision-evidence" ${state.showDecisionEvidence?'open':''}><summary>判断依据与反对证据 ${icon('chevron')}</summary><div class="strategy-reason"><div><strong>量价支持到哪一步</strong><p>成交量为前 20 日均量的 ${stock.volume.toFixed(2)} 倍，收盘 ${money(stock.price)} 元；尚未站上 ${ranges(stock.pressure)} 元压力区。</p></div><div><strong>哪些限制仍在</strong><p>${stock.risk}。资金流与估值缺口仍在，不输出确定上涨概率。</p></div></div></details></section>
 <nav class="strategy-jump" aria-label="策略页快捷定位">${[['plan','行动预案'],['price','量价依据'],['news','消息验证']].map(([key,name])=>`<button data-action="strategy-section" data-value="${key}" ${state.strategySection===key?'aria-current="location"':''}>${name}</button>`).join('')}<span>当前 ${held?'已持仓':'未持仓'} / ${state.horizon==='long'?'长期':state.horizon==='short'?'短期':'波段'}</span></nav>
 <div class="grid-main strategy-layout"><aside class="strategy-actions">${plan}</aside><div class="stack strategy-evidence">${price}${news}</div></div>`;

function screening() {
 const result=state.screenResult;
 const steps=['选范围','定方法','看候选'];
 let body='';
 if(state.screenStep===1) body=`<h2>先缩小范围，不急着排名</h2><p class="field-hint">先按市场与题材筛选，再用策略检查条件。</p><div class="divider"></div><label class="field">交易范围<select class="input" data-screen="board">${['全部 A 股','沪市主板','深市主板','创业板','科创板'].map(value=>`<option ${state.screen.board===value?'selected':''}>${value}</option>`).join('')}</select></label><label class="field">关注题材<select class="input" data-screen="topic">${['全部题材',...stocks.map(stock=>stock.sector)].map(value=>`<option ${state.screen.topic===value?'selected':''}>${value}</option>`).join('')}</select></label><div class="chip-grid">${stocks.map(stock=>`<button class="chip" data-action="topic" data-value="${stock.sector}" aria-pressed="${state.screen.topic===stock.sector}">${stock.sector}</button>`).join('')}</div><div class="note-box">热门主题仅为合成推荐，不是实时热度。此原型只演示 A 股选股，不假装支持其他市场筛选。</div><div class="row" style="margin-top:20px">${btn('下一步：选择方法 '+icon('arrow'),'screen-step','data-value="2"','primary')}</div>`;
 else if(state.screenStep===2) body=`<h2>按什么条件寻找机会？</h2><p class="field-hint">选择关注点，不把策略名称当作收益保证。</p><div class="stack" style="margin-top:20px">${[['回踩确认','趋势未破坏，等待支撑区承接'],['突破观察','价格接近压力，等待量价确认'],['风险优先','优先核验回撤与基本面约束']].map(([name,desc])=>`<button class="selection-card" style="width:100%" data-action="screen-strategy" data-value="${name}" aria-pressed="${state.screen.strategy===name}"><span class="check-circle"></span><span><strong>${name}</strong><p>${desc}</p></span></button>`).join('')}</div><div class="row between" style="margin-top:22px">${btn('返回范围','screen-step','data-value="1"')}${btn('开始演示筛选','screen-run','','primary')}</div>`;
 else body=result?`<div class="row between"><div><h2>本次筛选结果</h2><p class="field-hint">${esc(result.board)} / ${esc(result.topic)} / ${esc(result.strategy)} · 原始条件已固定</p></div>${btn('调整条件','screen-step','data-value="1"')}</div>${state.screenDirty?'<div class="notice" style="margin-top:16px">条件已修改；下方仍是上一次结果，重新运行后才会更新。</div>':''}<div class="divider"></div>${result.ids.length?stockTable(result.ids.map(id=>stocks[id]),{screen:true}):empty('没有符合本次范围的候选','没有结果不等于系统失败。可放宽条件后重新筛选。','screen-reset','调整筛选范围')}`:empty('还没有筛选结果','先选择范围和方法，再运行一次本地模拟筛选。','screen-reset','开始筛选');
 return heading('发现机会','先定范围和方法，再核验候选的行动条件',btn('查看上次样例','screen-history')+(result&&state.screenStep!==3?btn('查看已有结果','screen-step','data-value="3"'):''))+`<div class="grid-main"><section class="panel"><div class="stepper" aria-label="筛选步骤">${steps.map((text,index)=>`<div class="step-item ${state.screenStep===index+1?'active':''}"><span>${index+1}</span>${text}</div>`).join('')}</div>${body}</section><aside class="stack"><section class="panel"><h2>这次关注什么</h2><div class="list-item"><div class="grow"><span class="mini-label">范围</span><p>${esc(state.screen.board)} / ${esc(state.screen.topic)}</p></div></div><div class="list-item"><div class="grow"><span class="mini-label">方法</span><p>${esc(state.screen.strategy)}</p></div></div><div class="list-item"><div class="grow"><span class="mini-label">结果上限</span><p>最多 4 个演示候选</p></div></div></section><div class="note-box">候选不是买入信号。板块范围在样例中只用于流程展示，题材过滤作用于固定的四只虚构股票；不代表真实全市场覆盖。</div></aside></div>`;

function portfolio() {

function drawChart() {
 const stock=selected(),container=$('[data-chart]');if(!container)return;
 // Deterministic synthetic daily OHLC; weekly/monthly bars aggregate the same fixture.
 const daily=[];let prior=stock.price*.78,index=0;
 for(let date=new Date('2025-01-02T00:00:00Z');date<=new Date('2026-10-23T00:00:00Z');date.setUTCDate(date.getUTCDate()+1)) {
  if([0,6].includes(date.getUTCDay()))continue;
  const close=stock.price*(.78+index*.00047+Math.sin(index*.18)*.018),open=prior;
  daily.push({date:date.toISOString().slice(0,10),open,close,high:Math.max(open,close)*1.007,low:Math.min(open,close)*.993});prior=close;index++;
 }
 const shift=stock.price/daily.at(-1).close;daily.forEach(bar=>['open','close','high','low'].forEach(key=>bar[key]*=shift));
 Object.assign(daily.at(-2),{open:stock.previous*.998,close:stock.previous,high:stock.previous*1.008,low:stock.previous*.992});
 Object.assign(daily.at(-1),{open:stock.previous*.998,close:stock.price,high:Math.max(stock.price,stock.previous)*1.012,low:Math.min(stock.price,stock.previous)*.99});
 let bars=daily;
 if(state.period!=='daily'){const groups=new Map();daily.forEach(bar=>{let key=bar.date.slice(0,7);if(state.period==='weekly'){const date=new Date(bar.date+'T00:00:00Z');date.setUTCDate(date.getUTCDate()-(date.getUTCDay()+6)%7);key=date.toISOString().slice(0,10);}if(!groups.has(key))groups.set(key,{...bar});else{const group=groups.get(key);group.high=Math.max(group.high,bar.high);group.low=Math.min(group.low,bar.low);group.close=bar.close;group.date=bar.date;}});bars=[...groups.values()];}
 const width=Math.max(240,container.clientWidth-24),right=width-53;
 bars=bars.slice(-(width<400?16:24));
 container.innerHTML=`<figure class="chart"><svg viewBox="0 0 ${width} 230" role="img" aria-label="合成${state.period==='daily'?'日':state.period==='weekly'?'周':'月'}K线及技术参考位置"></svg><figcaption class="chart-output" aria-live="polite"></figcaption></figure><div class="chart-legend"><span>红空心：上涨 / 绿实心：下跌</span><span><i></i>支撑</span><span><i class="secondary"></i>压力</span></div><details><summary>查看当前图表数据与口径</summary><p>合成 OHLC，同一日线聚合周/月线，人民币，无公司行为。仅排除周末，不是真实交易日历。参考位置为样例参数，不声称算法计算。</p><div class="table-scroll"><table class="watch-table"><thead><tr><th>截至</th><th>开</th><th>高</th><th>低</th><th>收</th></tr></thead><tbody>${bars.map(bar=>`<tr><td>${bar.date}</td>${['open','high','low','close'].map(key=>`<td>${money(bar[key])}</td>`).join('')}</tr>`).join('')}</tbody></table></div></details>`;
 const svg=container.querySelector('svg'),ns='http://www.w3.org/2000/svg';
 const add=(tag,attrs,text)=>{const element=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([key,value])=>element.setAttribute(key,value));if(text!==undefined)element.textContent=text;svg.append(element);return element;};
 const low=Math.min(stock.stop*.98,...bars.map(bar=>bar.low)),high=Math.max(stock.pressure[1]*1.02,...bars.map(bar=>bar.high)),y=value=>200-(value-low)/(high-low)*178,x=index=>14+index*(right-22)/(bars.length-1);
 [0,.5,1].forEach(f=>{const price=low+(high-low)*f;add('line',{x1:8,x2:right,y1:y(price),y2:y(price),stroke:'var(--line)','stroke-width':.7});add('text',{x:right+8,y:y(price)+4,fill:'var(--muted)','font-size':11},price.toFixed(2));});
 [[stock.range[0],stock.range[1],'var(--blue)','support'],[stock.pressure[0],stock.pressure[1],'var(--orange)','pressure']].forEach(([lower,upper,color,key])=>{add('rect',{x:8,y:y(upper),width:right-8,height:y(lower)-y(upper),fill:color,opacity:state.overlay===key?.13:.035});[lower,upper].forEach(value=>add('line',{x1:8,x2:right,y1:y(value),y2:y(value),stroke:color,'stroke-width':state.overlay===key?1.6:.8,'stroke-dasharray':key==='pressure'?'5 4':''}));});
 add('line',{x1:8,x2:right,y1:y(stock.stop),y2:y(stock.stop),stroke:'var(--muted)','stroke-width':state.overlay==='stop'?2:1,'stroke-dasharray':'7 3 1 3'});
 const cross=add('line',{y1:12,y2:200,stroke:'var(--muted)',visibility:'hidden','pointer-events':'none'});
 const output=bar=>`${bar.date}  开 ${money(bar.open)}  高 ${money(bar.high)}  低 ${money(bar.low)}  收 ${money(bar.close)} 元`;
 bars.forEach((bar,index)=>{const rise=bar.close>=bar.open,color=rise?'var(--up)':'var(--down)';add('line',{x1:x(index),x2:x(index),y1:y(bar.high),y2:y(bar.low),stroke:color});add('rect',{x:x(index)-4,y:y(Math.max(bar.open,bar.close)),width:8,height:Math.max(1,Math.abs(y(bar.open)-y(bar.close))),fill:rise?'var(--chart)':color,stroke:color});const hit=add('rect',{x:x(index)-10,y:10,width:20,height:192,fill:'transparent',tabindex:0,role:'img','aria-label':output(bar)});const show=()=>{container.querySelector('figcaption').textContent=output(bar);cross.setAttribute('x1',x(index));cross.setAttribute('x2',x(index));cross.setAttribute('visibility','visible');};hit.addEventListener('pointerenter',show);hit.addEventListener('focus',show);hit.addEventListener('click',show);});
 add('text',{x:8,y:224,fill:'var(--muted)','font-size':11},bars[0].date);add('text',{x:right,y:224,'text-anchor':'end',fill:'var(--muted)','font-size':11},bars.at(-1).date);container.querySelector('figcaption').textContent=output(bars.at(-1));

 openDialog('记录演示交易，不执行买卖',`<form id="trade-form"><label class="field">股票<select class="input" name="stock">${stocks.map(stock=>`<option value="${stock.id}">${stock.name}</option>`).join('')}</select></label><div class="form-grid"><label class="field">方向<select class="input" name="side"><option value="buy">买入记录</option><option value="sell">卖出记录</option></select></label><label class="field">交易日期<input class="input" name="date" type="date" value="2026-10-23" max="2026-10-23" required></label><label class="field">数量 / 股<input class="input" name="qty" type="number" min="1" step="1" value="100" required></label><label class="field">成交价 / 元<input class="input" name="price" type="number" min="0.01" step="0.01" value="47.99" required></label></div><p class="field-error" id="trade-error"></p><button class="btn primary" type="submit">确认记录到演示账本</button><p class="field-hint">不含费用与资金核验，不具备真实证券交易能力。</p></form>`);
 $('#trade-form').onsubmit=event=>{event.preventDefault();const data=new FormData(event.currentTarget),stock=Number(data.get('stock')),qty=Number(data.get('qty')),price=Number(data.get('price')),side=data.get('side');const row=state.holdings.find(item=>item.account===state.account&&item.stock===stock);if(!Number.isInteger(qty)||qty<=0||!Number.isFinite(price)||price<=0||!stocks[stock]){$('#trade-error').textContent='数量须为正整数，价格须大于 0。';return;}if(side==='sell'&&(!row||row.qty<qty)){$('#trade-error').textContent='卖出数量超过此演示账户的持仓。';return;}event.currentTarget.querySelector('[type=submit]').disabled=true;if(side==='buy'){if(row){row.cost=(row.cost*row.qty+price*qty)/(row.qty+qty);row.qty+=qty;}else state.holdings.push({account:state.account,stock,qty,cost:price});}else row.qty-=qty;state.holdings=state.holdings.filter(item=>item.qty>0);state.records.push(`${stocks[stock].name} ${side==='buy'?'买入记录':'卖出记录'} ${qty} 股 @ ${money(price)} 元`);closeDialog();render();toast('演示账本已更新；未提交任何证券委托。');};
}
function reassess(stockId=state.selected) {
 state.selected=stockId;
 openDialog('先预览，再决定是否保存',`<p class="muted small">${selected().name} / 当前偏好：${state.signalProfile}</p><label class="field" style="margin-top:16px">新的风险偏好<select id="profile-select" class="input"><option>保守</option><option selected>均衡</option><option>积极</option></select></label><div id="profile-preview"></div>${btn('生成演示预览','profile-preview')}`);
}
function sendChat(text) {
 if(state.chatRunning||!text.trim())return;
 const session=state.sessions.find(item=>item.id===state.sessionId);session.messages.push({role:'user',text:text.trim().slice(0,1000)});state.chatRunning=true;state.chatOwner=session.id;render();
 state.chatTimer=setTimeout(()=>{session.messages.push({role:'assistant',text:`这是固定示例答复，不是对你问题的实时模型分析。围绕${stocks[session.stock].name}，先核验 ${ranges(stocks[session.stock].range)} 元区间是否获得承接；跌破 ${money(stocks[session.stock].stop)} 元或出现经营反证时，原计划需要重评。消息与估值缺口没有消失，不因价格上涨自行补齐证据。`});state.chatRunning=false;if(state.route==='chat')render();else toast('本地示例答复已生成，可返回问股查看。');},1200);
}
function download(name,text,type='text/plain') {const url=URL.createObjectURL(new Blob([text],{type}));const anchor=document.createElement('a');anchor.href=url;anchor.download=name;anchor.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function dirtyPrefs() {state.dirty=JSON.stringify(state.prefs)!==JSON.stringify(state.savedPrefs);applyTheme(state.prefs.theme);}
function renderKeepingFocus(button) {
 const identity={...button.dataset};
 render();
 const replacement=$$('[data-action]').find(control=>control.dataset.action===identity.action&&control.dataset.value===identity.value&&control.dataset.id===identity.id);
 replacement?.focus({preventScroll:true});
}
function jumpToStrategySection(section) {
 if(!['plan','price','news'].includes(section))return;
 const target=$('#strategy-'+section);if(!target)return;
 state.strategySection=section;
 $$('[data-action="strategy-section"]').forEach(button=>{if(button.dataset.value===section)button.setAttribute('aria-current','location');else button.removeAttribute('aria-current');});
 target.focus({preventScroll:true});
 target.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'});
}

document.addEventListener('click',event=>{
 const action=event.target.closest('[data-action]');if(action){event.preventDefault();const handler=actions[action.dataset.action];if(handler)handler(action);return;}
 const link=event.target.closest('a[href^="#"]');if(link&&link.hash!=='#main'){event.preventDefault();navigate(link.hash.slice(1));}
});
document.addEventListener('toggle',event=>{
 if(event.target.matches('.scenario-disclosure'))state.planScenario=$('.scenario-disclosure[open]')?.dataset.scenario||'';
 if(event.target.matches('.decision-evidence'))state.showDecisionEvidence=event.target.open;
},true);
document.addEventListener('input',event=>{
 const target=event.target;
 if(target.dataset.pref&&target.tagName==='INPUT'&&target.type!=='checkbox') {
  state.prefs[target.dataset.pref]=target.value;dirtyPrefs();
  ['settings-save','settings-reset'].forEach(action=>{const button=$(`[data-action="${action}"]`);if(button)button.disabled=!state.dirty;});
  if($('#settings-draft-note'))$('#settings-draft-note').hidden=!state.dirty;
 }
});
document.addEventListener('change',event=>{
 const target=event.target;
 if(target.id==='view-state'){state.viewState=target.value;render();}
 if(target.id==='account-select'){state.account=target.value;render();}
 if(target.id==='history-date'){state.historyDate=target.value;render();}
 if(target.dataset.screen){state.screen[target.dataset.screen]=target.value;state.screenDirty=!!state.screenResult;render();}
 if(target.dataset.pref){state.prefs[target.dataset.pref]=target.type==='checkbox'?target.checked:target.value;dirtyPrefs();if(target.tagName!=='INPUT'||target.type==='checkbox')render();}
 if(target.dataset.alertToggle){const rule=state.alerts.find(item=>item.id===Number(target.dataset.alertToggle));rule.on=target.checked;render();toast(rule.on?'演示开关开启；未启用真实监控。':'演示开关关闭。');}
});
document.addEventListener('submit',event=>{
 if(event.target.id==='chat-form'){event.preventDefault();sendChat($('#chat-input').value);}
 if(event.target.id==='login-form'){event.preventDefault();const password=$('#demo-password').value;if(password.length<6){$('#login-error').textContent='请输入至少 6 位演示字符。';return;}$('#demo-password').value='';state.loggedIn=true;navigate(state.loginDestination);toast('登录交互演示完成；未建立真实认证会话。');}
});
document.addEventListener('keydown',event=>{

 if(event.key==='Escape'){if($('#overlay').classList.contains('open'))closeDialog();else if(state.menuOpen){closeMenu();$('[data-action="menu"]').focus();}return;}
 const boundary=$('#overlay').classList.contains('open')?$('#dialog'):state.menuOpen?$('#sidebar'):null;
 if(boundary&&event.key==='Tab'){const focusable=[...boundary.querySelectorAll('button:not(:disabled),a,input,select,textarea,[tabindex="0"]')].filter(item=>item.getClientRects().length&&!item.closest('[hidden]'));const first=focusable[0],last=focusable.at(-1);if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}}
 if($('#global-search')&&['ArrowDown','ArrowUp'].includes(event.key)&&document.activeElement.matches('.search-result')){event.preventDefault();const list=$$('.search-result'),index=list.indexOf(document.activeElement);if(event.key==='ArrowUp'&&index===0)$('#global-search').focus();else list[(index+(event.key==='ArrowDown'?1:-1)+list.length)%list.length].focus();}
});
$('#overlay').addEventListener('click',event=>{if(event.target===$('#overlay'))closeDialog();});
$('#mobile-backdrop').onclick=closeMenu;
window.addEventListener('hashchange',()=>{
 const route=location.hash.slice(1)||'dashboard';
 if(state.dirty&&state.route==='settings'&&route!=='settings'){window.history.replaceState(null,'','#settings');navigate(route);return;}
 state.route=route;state.viewState='normal';render();window.scrollTo(0,0);$('#main').focus({preventScroll:true});
});
window.addEventListener('beforeunload',event=>{if(state.dirty){event.preventDefault();event.returnValue='';}});
window.addEventListener('resize',()=>{if($('[data-chart]'))drawChart();});
state.route=location.hash.slice(1)||'dashboard';render();
})();
</script>
</body>

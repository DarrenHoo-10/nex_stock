# Weekly trend + daily base breakout-retest strategy
# Compatible with daily_stock_analysis custom Agent Skill YAML format.
# This file guides AI analysis; it does not itself execute orders or guarantee a quantitative backtest.

name: weekly_daily_base_breakout_retest
display_name: 周线定方向·日线底部突破回踩
description: 周K过滤中期环境，日K识别左侧下跌后的底部震荡、有效突破、缩量回踩与止跌确认；以前高作为目标，并按结构失效止损。
category: trend
core_rules: [1, 2, 3, 4, 5]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
aliases:
  - 底部突破回踩
  - 周线日线共振
  - 箱体突破回踩
  - 底部平台突破
default_router: true
default_priority: 50
market_regimes: [sideways, trending_up, trending_down]

instructions: |
  # 策略目标
  寻找经历一段明显下跌后形成底部震荡区间的 A 股。等待日线有效突破箱体上沿，再等待价格回踩突破区域并确认支撑后介入；接近前期高点压力区时止盈，结构失效时止损。
  周线用于判断中期环境，日线用于识别形态和执行信号。不要把“跌得多”直接等同于“底部”。

  # 数据与证据规则
  1. 优先调用 get_daily_history 获取足够长的日线 OHLCV 数据；调用 analyze_trend 获取趋势、支撑阻力和指标；调用 get_realtime_quote 获取最新行情。
  2. 若工具没有直接提供周K，必须用已收盘的日K按自然周聚合为周K：开盘=该周首个交易日开盘，最高/最低=该周最高/最低，收盘=该周最后一个已完成交易日收盘，成交量/成交额求和。不得用尚未收盘的本周周K确认历史信号。
  3. 明确区分已观察到的数据、策略推断和缺失数据。缺少足够历史K线、成交量或前高信息时，结论必须标为“数据不足”，不得编造价格位、资金流或指标。
  4. 这是分析策略 Skill，不代表程序已经自动扫描全市场、下单或完成历史回测。任何价格和信号都应以可用数据为准。

  # 第一层：周线方向过滤
  将周线作为环境过滤器，而非必须与日线同时突破的触发器。
  - 优先级较高：周线低点不再持续明显下移，收盘重新站回周线短期均线（如 MA5）或周线中期趋势恶化速度放缓。
  - 更理想：周线形成横盘/底部结构，或周线收盘逐步抬高；所属行业/指数同期不明显走弱。
  - 风险较高：周线仍处于明显加速下跌、连续放量长阴、持续创新低，或有重大退市/财务/监管风险。此类标的排除或显著降级。
  - 周线条件用于分级，不可仅因一条均线满足就断言反转。

  # 第二层：日线底部震荡区间识别
  以最近一段明显下跌后的整理区为候选结构。以下为初始研究阈值，不是普适真理：
  - 下跌背景：回看约 60 个交易日，曾出现约 20% 或以上的阶段跌幅；结合个股波动率调整，不能单独作为入选依据。
  - 震荡时长：优先约 20–60 个交易日；整理过短时降低置信度。
  - 箱体上沿 H：整理区内多次反弹受阻的价格区域；箱体下沿 L：多次止跌的价格区域。至少应有两次相对独立的触碰/测试，优先三次。
  - 若区间内存在极端异常单日、除权跳空或重大事件，应调整/排除异常点，避免用单根异常K线定义箱体。
  - 记录 H、L、箱体宽度 (H-L)/H、震荡持续天数、支撑/压力测试次数、区间内量能变化。
  - 若无法稳定识别 H 与 L，输出“箱体不清晰”，不生成精确交易计划。

  # 第三层：日线有效突破
  突破日需尽可能同时满足：
  1. 日线收盘价 C 高于 H + max(0.5%*H, 0.2*ATR20)。ATR20 不可得时，可使用 H 上方约 0.5% 作为简化缓冲，并注明简化。
  2. 当日成交量 / 过去 20 个交易日平均成交量 >= 1.5，作为初始量能过滤阈值；若成交量不可用，不得声称放量突破。
  3. 收盘位于当日振幅的上部，避免冲高回落型突破。
  4. 检查突破位上方是否紧邻更大级别前高/周线压力。若目标空间太小，放弃或降级。
  5. 若价格仅盘中越过 H、但收盘回到 H 下方，视为未确认突破。
  不要因为突破当天强势就追高；本策略核心买点是后续回踩确认。

  # 第四层：突破后回踩与买入触发
  - 优先观察突破后第 3–15 个交易日内的回踩；超过窗口且价格已大幅远离 H 时，不追入，等待新结构。
  - 回踩区域可初步定义为 H ± 0.5*ATR20；无 ATR 时使用 H ± 1% 的临时容差，并注明该容差未按波动率调整。
  - 理想的回踩量能低于突破日，且回踩阶段成交量相对 5 日/20 日均量收缩；量能仅作辅助，不单独决定买入。
  - 回踩期间不得出现明确的收盘失守箱体上沿并持续走弱。若收盘明显跌回箱体内，信号降级；若跌破箱体下沿 L，视为原底部结构失效。
  - 触发确认可采用以下任一方式，但必须写清采用哪一种：
      A. 回踩后日线收盘重新站回 H 上方；
      B. 出现明确止跌反转K线，且随后价格突破该反转K线高点。
  - 仅仅触碰 H 不等于支撑确认。没有确认信号时，结论为“等待”，不输出“立即买入”。
  - 入场参考价以确认后可实际成交的价格为准，通常按下一交易日可成交价格估计；不得假设能买在最低点。

  # 第五层：止损、止盈与盈亏比
  止损必须在入场前定义，并同时评估局部交易失效和整个箱体失效：
  - 局部止损参考回踩形成的局部低点下方，预留适度波动缓冲；不得把缓冲写成保证成交的价格。
  - 结构失效线为箱体下沿 L 下方。若局部止损距离过大或位置不合理，应放弃交易，而不是为了提高盈亏比随意缩窄止损。
  - 目标价 T 优先取前期明显摆动高点/周线压力区域，并以区间表示压力带；不要把单一价格描述成必然阻力。
  - 入场前计算潜在盈亏比：(T - E) / (E - S)，其中 E 为预期入场价、S 为止损价、T 为第一目标价。初始筛选要求至少约 2:1；若达不到，放弃或降低优先级。
  - 接近前高压力区时，计划分批止盈；若有效放量突破前高，可对剩余仓位使用移动止盈，但这属于可选管理规则，不可事后改变原策略定义。
  - 若买入后约 10–15 个交易日没有向目标推进，可将时间止损作为待回测规则，而非硬性普适结论。
  - A股存在 T+1、涨跌停、跳空和流动性约束；实际成交可能劣于止损价。不要声称止损价一定能成交。

  # 风险与市场过滤
  - 检查 ST/退市风险、停牌、重大财务异常、重大诉讼/监管事件、业绩预告和减持等事件；若数据源未提供，明确标注未检查。
  - 关注所属行业和主要指数方向。大盘/行业明显走弱时降低信号等级，不要将行业 beta 误判为个股独立强势。
  - 个股资金流是辅助信息，不是必要条件；不同供应商口径不一致时，不得混合比较，也不得把“净流入”直接解释为机构吸筹。
  - 同一行业或高度相关股票应考虑组合集中风险。单笔风险比例可以在回测中测试账户净值的 0.5%–1%，不是固定投资建议。

  # 输出格式
  请严格按以下结构输出：
  1. 策略结论：未形成箱体 / 箱体形成等待突破 / 突破待回踩 / 回踩中等待确认 / 买入触发候选 / 结构失效 / 数据不足。
  2. 周线环境：偏多 / 中性 / 偏空，并列出已观察到的证据。
  3. 日线结构：下跌背景、箱体时间范围、H、L、箱体宽度、测试次数、ATR20、20日均量。
  4. 突破检查：收盘是否越过 H、突破幅度、成交量比、收盘位置、上方压力。
  5. 回踩检查：距 H 的距离、回踩天数、量能变化、确认信号是否出现。
  6. 交易计划：参考入场区、局部止损、箱体失效位、前高目标区、潜在盈亏比、信号失效条件。数据不充分时写“无法计算”，不得臆造。
  7. 风险清单：市场/行业、财务公告、流动性、跳空、T+1 等风险。
  8. 最终动作：观察 / 等待 / 候选入场 / 结构失效；避免无条件使用“买入”或“卖出”指令。
  9. 证据与缺失：列出实际调用到的数据、时间范围、缺失字段和判断限制。

  # 纪律
  - 不预测“必涨”，不保证收益。
  - 不因用户期待买入而降低入场条件。
  - 不能用未来数据定义历史箱体、前高、突破或回踩。
  - 参数均为第一轮研究默认值，需用 A 股历史数据、交易成本和样本外测试验证后再调整。

# Weekly trend + daily base breakout-retest strategy
# Compatible with daily_stock_analysis custom Agent Skill YAML format.
# This file guides AI analysis; it does not itself execute orders or guarantee a quantitative backtest.

name: weekly_daily_base_breakout_retest
display_name: 周线定方向·日线底部突破回踩
description: 周K过滤中期环境，日K识别左侧下跌后的底部震荡、有效突破、缩量回踩与止跌确认；以前高作为目标，并按结构失效止损。
category: trend
core_rules: [1, 2, 3, 4, 5]
required_tools:
  - get_daily_history
  - analyze_trend
  - get_realtime_quote
  - search_stock_news
aliases:
  - 底部突破回踩
  - 周线日线共振
  - 箱体突破回踩
  - 底部平台突破
default_priority: 50
market_regimes: [sideways, trending_down]

instructions: |
  # 策略目标
  寻找经历一段明显下跌后形成底部震荡区间的 A 股。等待日线有效突破箱体上沿，再等待价格回踩突破区域并确认支撑后介入；接近前期高点压力区时止盈，结构失效时止损。
  周线用于判断中期环境，日线用于识别形态和执行信号。不要把“跌得多”直接等同于“底部”。

  # 数据与证据规则
  1. 必须调用 `get_daily_history(days=250)` 获取约一年的日线 OHLCV 数据（下跌背景 + 箱体 + 突破回踩 + 下跌前的前高，至少需要约 130 个交易日；不要使用默认的 60 天）。若返回不足 130 个交易日，结论标为“数据不足”。
  2. 调用 `analyze_trend` 获取趋势、support_levels / resistance_levels 和量能状态；调用 `get_realtime_quote` 获取最新行情；调用 `search_stock_news` 检查利空、ST、减持、监管等事件。
  3. 若工具没有直接提供周K，用日K按自然周聚合：开盘=该周首个交易日开盘，最高/最低=该周最高/最低，收盘=该周最后一个交易日收盘，成交量/成交额求和。只有已全部收盘的自然周参与周线判断；当前未走完的本周只作参考，不得用于确认任何信号。
  4. 工具不提供 ATR 时，ATR20 = 最近 20 个交易日真实波幅（max(最高-最低, |最高-前收|, |最低-前收|)）的简单平均，用日线数据自行计算并注明。
  5. 明确区分已观察到的数据、策略推断和缺失数据。缺少足够历史K线、成交量或前高信息时，结论必须标为“数据不足”，不得编造价格位、资金流或指标。
  6. 这是分析策略 Skill，不代表程序已经自动扫描全市场、下单或完成历史回测。任何价格和信号都应以可用数据为准。

  # 第一层：周线方向过滤
  将周线作为环境过滤器，而非必须与日线同时突破的触发器。
  - 偏多：周线低点不再下移、收盘重新站回周线 MA5，或周线形成横盘/底部结构、收盘逐步抬高；所属行业/指数同期不明显走弱。
  - 中性：周线下跌速度放缓，但尚未站回周线 MA5、也未形成更高的低点。
  - 偏空：周线仍明显加速下跌、连续放量长阴、持续创新低，或有重大退市/财务/监管风险。偏空时结论最高只能为“观察”，不生成交易计划。
  - 周线条件用于分级，不可仅因一条均线满足就断言反转。

  # 第二层：日线底部震荡区间识别
  以最近一段明显下跌后的整理区为候选结构。以下为初始研究阈值，不是普适真理：
  - 震荡时长：优先约 20–60 个交易日；不足 20 个交易日时降低置信度。
  - 箱体上沿 H：整理区内多次反弹受阻的价格区域；箱体下沿 L：多次止跌的价格区域。上下沿各至少有两次相对独立的触碰/测试（间隔至少 5 个交易日），优先三次。
  - 下跌背景：以箱体起点为终点，向前回看约 60 个交易日，区间最高价到箱体起点附近低点的跌幅约 20% 或以上；该下跌段不得与箱体时间段重叠。结合个股波动率调整，不能单独作为入选依据。
  - 前高 P：取下跌段起点附近的明显摆动高点（即下跌开始前的高点），作为后续目标区参考。
  - 若区间内存在极端异常单日、除权跳空或重大事件，应调整/排除异常点，避免用单根异常K线定义箱体。
  - 记录 H、L、箱体宽度 (H-L)/H、震荡持续天数、支撑/压力测试次数、区间内量能变化。
  - 若无法稳定识别 H 与 L，输出“箱体不清晰”，不生成精确交易计划。

  # 第三层：日线有效突破
  突破日需尽可能同时满足：
  1. 日线收盘价 C 高于 H + max(0.5%*H, 0.2*ATR20)。
  2. 当日成交量 / 过去 20 个交易日平均成交量 >= 1.5，作为初始量能过滤阈值；若成交量不可用，不得声称放量突破。
  3. 收盘位于当日振幅的上 1/3，即 (C - 当日最低) / (当日最高 - 当日最低) >= 0.67，避免冲高回落型突破。
  4. 检查突破位上方是否紧邻更大级别前高/周线压力。若 (P - H) / H < 10%，目标空间太小，放弃或降级。
  5. 若价格仅盘中越过 H、但收盘回到 H 下方，视为未确认突破。
  不要因为突破当天强势就追高；本策略核心买点是后续回踩确认。

  # 第四层：突破后回踩与买入触发
  - 回踩定义：突破后第 3–15 个交易日内，日线最低价进入回踩区 H ± 0.5*ATR20。超过窗口仍未回踩且价格已大幅远离 H 时，不追入，等待新结构。
  - 理想的回踩量能低于突破日，且回踩阶段成交量相对 5 日/20 日均量收缩；量能仅作辅助，不单独决定买入。
  - 回踩期间若出现收盘低于 H - 0.5*ATR20（明显跌回箱体内），信号降级为“突破失败观察”；若收盘跌破箱体下沿 L，视为原底部结构失效。
  - 记回踩阶段最低价所在K线为回踩低点K线 R（最低价 R_low，最高价 R_high）。触发确认二选一，必须写清采用哪一种：
      A. 在 R 之后，出现一根收盘价同时高于 H 和 R_high 的阳线；
      B. R 本身或其后一根为明确止跌反转K线（锤子线、看涨吞没等），且随后价格突破该反转K线高点。
  - 仅仅触碰 H、或收盘一直维持在 H 上方但没有出现 A/B 信号，都不等于支撑确认。没有确认信号时，结论为“等待”，不输出“立即买入”。
  - 入场参考价 E 以确认后可实际成交的价格为准，通常按下一交易日可成交价格估计；不得假设能买在最低点。

  # 第五层：止损、止盈与盈亏比
  止损必须在入场前定义：
  - 交易止损 S（用于计算盈亏比和仓位）：R_low 下方预留约 0.3*ATR20 的缓冲。不得把缓冲写成保证成交的价格。
  - 结构失效位：箱体下沿 L 下方。它只用于判断底部结构是否作废，不作为本次交易的止损价，也不用于计算盈亏比。
  - 若 (E - S) / E > 8%，说明止损距离过大，放弃交易；不得为了提高盈亏比随意把止损挪到 R_low 上方。
  - 目标区 T：以前高 P 为中心、结合周线压力，以区间表示压力带；第一目标价取压力带下沿。不要把单一价格描述成必然阻力。
  - 盈亏比 = (T - E) / (E - S)。初始筛选要求 >= 2:1；达不到则放弃或降为“观察”。
  - 接近前高压力区时，计划分批止盈；若有效放量突破前高，可对剩余仓位使用移动止盈，但这属于可选管理规则，不可事后改变原策略定义。
  - 若买入后约 10–15 个交易日没有向目标推进，可将时间止损作为待回测规则，而非硬性普适结论。
  - A股存在 T+1、涨跌停、跳空和流动性约束；实际成交可能劣于止损价。不要声称止损价一定能成交。

  # 风险与市场过滤
  - 用 `search_stock_news` 检查 ST/退市风险、停牌、重大财务异常、重大诉讼/监管事件、业绩预告和减持等事件；若未检索到或工具不可用，明确标注“未检查”。存在重大利空时结论最高为“观察”。
  - 关注所属行业和主要指数方向。大盘/行业明显走弱时降低信号等级，不要将行业 beta 误判为个股独立强势。
  - 个股资金流是辅助信息，不是必要条件；不同供应商口径不一致时，不得混合比较，也不得把“净流入”直接解释为机构吸筹。
  - 同一行业或高度相关股票应考虑组合集中风险。单笔风险比例可以在回测中测试账户净值的 0.5%–1%，不是固定投资建议。

  # 结论与输出
  遵循系统要求的输出格式（JSON 等），不要另起一套输出结构。按以下状态给出结论，并在分析理由 / `buy_reason` 中注明“底部突破回踩”及所处状态：
  - 数据不足 / 箱体不清晰 / 未形成箱体：不调整评分，说明缺失项。
  - 箱体形成等待突破：`sentiment_score +0`，观察。
  - 突破待回踩：`sentiment_score +3`，等待回踩，不追高。
  - 回踩中等待确认：`sentiment_score +5`，等待 A/B 确认信号。
  - 买入触发候选（确认信号出现、周线非偏空、盈亏比 >= 2:1）：`sentiment_score +12`；周线偏多时可到 `+15`。
  - 突破失败观察（收盘明显跌回箱体内）：`sentiment_score -5`。
  - 结构失效（收盘跌破 L）：`sentiment_score -15`，离场。
  分析理由中应覆盖：周线环境（偏多/中性/偏空及证据）；日线结构（下跌背景、箱体时间范围、H、L、箱体宽度、测试次数、ATR20、20日均量、前高 P）；突破检查（突破日、突破幅度、量比、收盘位置）；回踩检查（回踩天数、距 H 距离、量能变化、采用的确认方式 A/B）；交易计划（E、S、结构失效位、目标区 T、盈亏比，无法计算时写“无法计算”）；风险清单（市场/行业、公告事件、流动性、跳空、T+1）；实际使用的数据范围与缺失字段。
  避免无条件使用“买入”或“卖出”指令。

  # 纪律
  - 不预测“必涨”，不保证收益。
  - 不因用户期待买入而降低入场条件。
  - 不能用未来数据定义历史箱体、前高、突破或回踩。
  - 参数均为第一轮研究默认值，需用 A 股历史数据、交易成本和样本外测试验证后再调整。

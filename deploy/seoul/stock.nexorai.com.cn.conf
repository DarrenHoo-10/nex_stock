# ===========================================================================
# stock.nexorai.com.cn - 首尔 nginx 站点（静态 SPA + /api 反向代理到后端）
# 安装位置：/etc/nginx/sites-available/stock.nexorai.com.cn，并软链到 sites-enabled
# 使用前把 __BACKEND_ZEROTIER_IP__ 替换为后端主机的 ZeroTier 内网 IP：当前是 Mac（deploy/mac/README.md），
# 备用是东京（与东京 STOCK_BIND_ADDR 一致）；更换后端见 README.md「切换后端」；
# 没替换时 nginx -t 会因为找不到该主机而报错，不会带着占位符上线。
# 首次部署证书还不存在时，先用 stock.nexorai.com.cn.http-bootstrap.conf（只有 80 端口），
# 签发证书后再换成本文件，详见 README.md。
# ===========================================================================

upstream nex_stock_backend {
    server __BACKEND_ZEROTIER_IP__:8000;
    keepalive 16;
}

# --- 80：ACME 校验 + 跳转 https ---------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name stock.nexorai.com.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/nex_stock_frontend/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- 443：SPA 静态文件 + /api 代理 -------------------------------------------
server {
    # nginx >= 1.25.1 可改为 `listen 443 ssl;` + `http2 on;`（旧写法仍可用，只会有弃用警告）
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stock.nexorai.com.cn;

    ssl_certificate     /etc/letsencrypt/live/stock.nexorai.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stock.nexorai.com.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # 如果服务器上其他站点已经 include 了 certbot 的 options-ssl-nginx.conf，可以改为沿用同一份。

    root /opt/nex_stock_frontend/current;
    index index.html;

    # 上传图片识别自选股（最大 5MB）、.env 备份导入等
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # --- 代理公共设置（下面各 /api location 继承；它们自己不再设置 proxy_set_header）---
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # user_center 模式的 user_session Cookie 必须原样到达后端（后端逐请求向用户中心校验）；
    # Origin / X-CSRF-Token 请求头默认也会透传，非 GET 请求依赖它们。
    proxy_set_header Cookie $http_cookie;
    # /api/login、/api/logout 返回 302，Location 指向用户中心，不允许 nginx 改写。
    proxy_redirect off;
    proxy_connect_timeout 10s;

    # 带哈希的构建产物：长期缓存。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # 入口文件不缓存，发布新版本后立即生效。
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
    }

    # --- 流式接口：关闭缓冲、放宽超时 -------------------------------------
    # 问股助手流式回答（POST，SSE）
    location = /api/v1/agent/chat/stream {
        proxy_pass http://nex_stock_backend;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 任务状态 SSE 流（GET，EventSource，长连接）
    location = /api/v1/analysis/tasks/stream {
        proxy_pass http://nex_stock_backend;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # --- 其余 API（含 /api/health、/api/session、/api/login、/api/logout）------
    location /api/ {
        proxy_pass http://nex_stock_backend;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 后端的 /docs、/redoc、/openapi.json 不对外代理（user_center 模式下它们也需要登录）。
    # /stocks.index.json 使用构建产物里自带的静态副本，由下面的 location / 提供。

    # SPA：静态文件优先，其余回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# 首次部署用：只有 80 端口，用来让 certbot 通过 webroot 校验并签发证书。
# 证书签发成功后，换成 stock.nexorai.com.cn.conf（含 443），详见 README.md。
server {
    listen 80;
    listen [::]:80;
    server_name stock.nexorai.com.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /opt/nex_stock_frontend/acme;
    }

    location / {
        return 404;
    }
}
